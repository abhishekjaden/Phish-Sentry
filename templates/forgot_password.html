<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PhishSentry</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { background:#1e293b; padding:40px; border-radius:12px; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    h2 { margin:0 0 8px; }
    p.sub { color:#94a3b8; font-size:14px; margin:0 0 24px; }
    label { display:block; font-size:13px; margin-bottom:6px; color:#cbd5e1; }
    input { width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; box-sizing:border-box; margin-bottom:18px; }
    button { width:100%; padding:12px; border:none; border-radius:8px; background:#4f46e5; color:#fff; font-size:15px; cursor:pointer; }
    button:hover { background:#4338ca; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:18px; font-size:14px; }
    .flash.error { background:#7f1d1d; color:#fecaca; }
    .flash.success { background:#14532d; color:#bbf7d0; }
    a { color:#818cf8; font-size:13px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Forgot your password?</h2>
    <p class="sub">Enter your email and we'll send you a reset link.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('forgot_password') }}">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <button type="submit">Send reset link</button>
    </form>
    <p style="margin-top:18px;"><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
  </div>
</body>
</html>
