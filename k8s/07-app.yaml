# The Flask/Gunicorn web app — the only workload the public Ingress routes to.
# Pulls all non-secret env from the ConfigMap and all credentials from the
# Secret via envFrom. Starts at 2 replicas; the HPA (10-hpa.yaml) scales it.
# CPU requests are set so the HPA has a baseline to compute utilization against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: phishsentry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: 192497949426.dkr.ecr.ap-south-1.amazonaws.com/phishsentry-app:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: phishsentry-config
            - secretRef:
                name: phishsentry-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: phishsentry
spec:
  selector:
    app: app
  ports:
    - port: 8001
      targetPort: 8001
