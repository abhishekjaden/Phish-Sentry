# Postgres with the pgvector extension — stateful, so it's a StatefulSet with a
# per-replica PersistentVolumeClaim backed by the EBS CSI gp3 StorageClass
# (provisioned by the addon in the eksctl config). One replica: this is the
# RAG vector store + app database, not a HA cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: phishsentry
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: phishsentry-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: phishsentry-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phishsentry-secrets
                  key: POSTGRES_PASSWORD
            # Subdir avoids the "lost+found" init issue on fresh EBS volumes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "phishguard"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "phishguard"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
---
# Headless Service: stable in-cluster DNS name "postgres" for the app/rag/worker.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: phishsentry
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
