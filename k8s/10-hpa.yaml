# Scales the app Deployment on CPU. Demonstrates the autoscaling the CKAD covers
# and gives the deployment a real production behavior: replicas grow under load
# (e.g. a burst of reviewers or a load test) and settle back when idle.
# Requires the metrics-server addon in the cluster (install after cluster-up).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: phishsentry
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid flapping: wait 5 min before scaling in
