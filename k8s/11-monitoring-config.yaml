# Prometheus config + alert rules for the PhishSentry cluster.
# Scrapes the app's /metrics endpoint (prometheus_flask_exporter) in-cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: phishsentry
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: 'phishguard-app'
        static_configs:
          - targets: ['app.phishsentry.svc.cluster.local:8001']
        metrics_path: '/metrics'
  alert_rules.yml: |
    groups:
      - name: phishguard_alerts
        rules:
          - alert: HighErrorRate
            expr: sum(rate(flask_http_request_total{status=~"5.."}[2m])) / sum(rate(flask_http_request_total[2m])) > 0.1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate (>10%)"
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum by (le) (rate(flask_http_request_duration_seconds_bucket[5m]))) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "p95 latency above 2 seconds"
          - alert: AppDown
            expr: up{job="phishguard-app"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PhishGuard app is down"
