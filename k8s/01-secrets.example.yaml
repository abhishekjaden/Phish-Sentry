# TEMPLATE ONLY — do NOT commit real secret values to git.
#
# Anything containing a credential lives here (not in the ConfigMap):
#   - DATABASE_URL carries the Postgres password, so it belongs in the Secret.
#   - POSTGRES_PASSWORD is consumed by the Postgres StatefulSet.
#
# Create the real Secret on the cluster from your .env instead of applying
# this file, e.g.:
#
#   kubectl -n phishsentry create secret generic phishsentry-secrets \
#     --from-literal=FLASK_SECRET_KEY="$(grep ^FLASK_SECRET_KEY .env | cut -d= -f2-)" \
#     --from-literal=JWT_SECRET_KEY="$(grep ^JWT_SECRET_KEY .env | cut -d= -f2-)" \
#     --from-literal=GEMINI_API_KEY="$(grep ^GEMINI_API_KEY .env | cut -d= -f2-)" \
#     --from-literal=POSTGRES_PASSWORD="phishguard_secret" \
#     --from-literal=DATABASE_URL="postgresql://phishguard:phishguard_secret@postgres:5432/phishguard" \
#     --from-literal=GRAFANA_ADMIN_PASSWORD="<choose-a-strong-one>"
#
# The keys below show the required shape so the Deployments can reference them.
apiVersion: v1
kind: Secret
metadata:
  name: phishsentry-secrets
  namespace: phishsentry
type: Opaque
stringData:
  FLASK_SECRET_KEY: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  GEMINI_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "phishguard_secret"
  DATABASE_URL: "postgresql://phishguard:phishguard_secret@postgres:5432/phishguard"
  GRAFANA_ADMIN_PASSWORD: "REPLACE_ME"
